<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Упаксервис — производство полимерной упаковки</title>
<meta name="description" content="Производство гибкой полимерной упаковки и упаковочные материалы со склада в Хабаровске">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
:root{--f-site:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--f-disp:"Unbounded","Manrope",system-ui,Arial,sans-serif}
html,body{margin:0}
body{background:#fff}
img{max-width:100%}
/* ================= МАКЕТ САЙТА ================= */
.site{
  --s-bg:#FFFFFF; --s-soft:#F4F6FA; --s-ink:#0F1A2C; --s-mute:#5E6B7E; --s-line:#E3E8EF;
  --s-blue:#1D4FA8; --s-navy:#0B1C38; --s-navy2:#12284D; --s-red:#E1312C; --s-sky:#5BA8E8; --s-ice:#EAF2FC; --s-green:#1E8E4E;
  container-type:inline-size;background:var(--s-bg);color:var(--s-ink);font-family:var(--f-site);font-size:15px;line-height:1.5;color-scheme:light}
.site *{box-sizing:border-box}
.site a{color:inherit;text-decoration:none}
.s-in{max-width:1200px;margin:0 auto;padding-inline:36px}
.s-disp{font-family:var(--f-disp);font-weight:600;letter-spacing:-.02em}
.s-kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--s-red)}

.s-top{background:var(--s-navy);color:#AFC0DA;font-size:13px}
.s-top .s-in{display:flex;gap:22px;align-items:center;height:36px}
.s-top .sp{flex:1}
.s-top b{color:#fff;font-weight:600}
.s-head{background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--s-line);position:sticky;top:0;z-index:5}
.s-head .s-in{display:flex;align-items:center;gap:26px;height:76px}
.s-logo{flex:none;display:block;width:210px}
.s-logo svg{width:100%;height:auto;display:block}
.s-nav{display:flex;gap:20px;font-weight:600;font-size:14.5px;flex:1;white-space:nowrap}
.s-nav a{position:relative;padding-block:6px}
.s-nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--s-red);border-radius:2px}
.s-phone{flex:none;line-height:1.2;text-align:right}
.s-phone b{display:block;font-size:17px;font-weight:800}
.s-phone small{color:var(--s-blue);font-weight:700;font-size:12.5px}
.s-icons{display:flex;gap:4px}
.s-ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;position:relative}
.s-ico .badge{position:absolute;top:3px;right:2px;background:var(--s-red);color:#fff;font-size:11px;font-weight:800;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.s-burger{display:none}

/* hero */
.s-hero{background:radial-gradient(1200px 500px at 85% 20%,#1E3E73 0,transparent 60%),linear-gradient(160deg,var(--s-navy) 0,var(--s-navy2) 100%);color:#fff;position:relative;overflow:hidden}
.s-hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.s-hero .s-in{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding-block:56px 0;position:relative;z-index:1}
.s-hero .s-kick{color:#FF8A84}
.s-hero h1{font-size:46px;line-height:1.1;margin:14px 0 18px;text-wrap:balance}
.s-hero h1 em{font-style:normal;color:#8CC4F5}
.s-hero p{color:#C3D1E6;font-size:17.5px;max-width:48ch;margin:0 0 28px}
.s-btns{display:flex;gap:12px;flex-wrap:wrap}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:12px;font-weight:700;font-size:15px}
.s-btn.pri{background:var(--s-red);color:#fff;box-shadow:0 8px 20px rgba(225,49,44,.35)}
.s-btn.ghost{border:1.5px solid rgba(255,255,255,.35);color:#fff}
.s-btn.dark{background:var(--s-navy);color:#fff}
.s-btn.line{border:1.5px solid var(--s-line);color:var(--s-ink);background:#fff}
.s-art{position:relative;align-self:end}
.s-art svg{display:block;width:100%;height:auto}
.s-badge{position:absolute;background:rgba(255,255,255,.96);color:var(--s-ink);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.s-badge i{width:8px;height:8px;border-radius:50%;background:var(--s-red);display:block}
.s-facts{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
.s-facts .s-in{display:grid;grid-template-columns:repeat(4,1fr);padding-block:0}
.s-facts .s-in>div{padding:22px 20px 24px 0}
.s-facts .s-in>div+div{padding-left:22px;border-left:1px solid rgba(255,255,255,.12)}
.s-facts b{display:block;font-family:var(--f-disp);font-weight:600;font-size:22px;letter-spacing:-.02em}
.s-facts span{color:#AFC0DA;font-size:13.5px}

/* sections */
.s-sec{padding:64px 0}
.s-sec.soft{background:var(--s-soft)}
.s-h{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}
.s-h h2{font-size:32px;line-height:1.15;margin:8px 0 0;text-wrap:balance;max-width:22ch}
.s-h p{color:var(--s-mute);max-width:46ch;margin:0}
.s-h .more{color:var(--s-blue);font-weight:700;white-space:nowrap}

/* два пути */
.s-paths{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.s-path{border-radius:20px;padding:30px;display:grid;gap:16px;position:relative;overflow:hidden;min-height:250px}
.s-path.make{background:var(--s-navy);color:#fff}
.s-path.stock{background:var(--s-ice)}
.s-path h3{font-family:var(--f-disp);font-weight:600;font-size:24px;letter-spacing:-.02em;margin:0}
.s-path p{margin:0;max-width:40ch}
.s-path.make p{color:#C3D1E6}
.s-path.stock p{color:var(--s-mute)}
.s-path ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.s-path li{font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px}
.s-path.make li{background:rgba(255,255,255,.1);color:#E3ECF8}
.s-path.stock li{background:#fff;color:var(--s-ink)}
.s-path .s-btn{justify-self:start}
.s-path img{position:absolute;right:-20px;bottom:-20px;width:190px;opacity:.95;border-radius:20px;mix-blend-mode:multiply}
.s-path.make::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(91,168,232,.14)}

/* производство */
.s-made{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.s-mcard{background:#fff;border:1px solid var(--s-line);border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.s-mcard .ph{aspect-ratio:4/3;background:var(--s-soft) center/cover no-repeat;position:relative}
.s-mcard .ph span{position:absolute;left:12px;top:12px;background:var(--s-navy);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.02em}
.s-mcard .tx{padding:16px 18px 20px;display:grid;gap:6px;align-content:start}
.s-mcard h3{font-size:17px;margin:0;line-height:1.3}
.s-mcard p{margin:0;color:var(--s-mute);font-size:14px}
.s-mcard .mat{font-size:12.5px;color:var(--s-blue);font-weight:700}

/* шаги */
.s-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:st;border:1px solid var(--s-line);border-radius:20px;background:#fff;overflow:hidden}
.s-step{padding:26px 24px;counter-increment:st;position:relative}
.s-step+.s-step{border-left:1px solid var(--s-line)}
.s-step::before{content:counter(st,decimal-leading-zero);font-family:var(--f-disp);font-weight:500;font-size:13px;color:var(--s-red);letter-spacing:.04em;display:block;margin-bottom:14px}
.s-step b{display:block;font-size:17px;margin-bottom:6px}
.s-step span{color:var(--s-mute);font-size:14px}

/* каталог */
.s-groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.s-groups a{border:1.5px solid var(--s-line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;background:#fff}
.s-groups a.on{background:var(--s-navy);border-color:var(--s-navy);color:#fff}
.s-cats{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.s-cat{background:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--s-line);transition:transform .2s,box-shadow .2s}
.s-cat:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,28,56,.10)}
.s-cat b{font-size:16px;line-height:1.25;max-width:11ch;position:relative;z-index:1}
.s-cat small{color:var(--s-mute);font-size:12.5px;position:relative;z-index:1;max-width:15ch}
.s-cat img{position:absolute;right:-4px;bottom:-4px;width:48%;height:auto;aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply;max-width:100%}
.s-cat.big{grid-row:span 2;grid-column:span 2;background:linear-gradient(140deg,#fff 0,var(--s-ice) 100%)}
.s-cat.big b{font-family:var(--f-disp);font-weight:600;font-size:24px;letter-spacing:-.02em;max-width:14ch}
.s-cat.big small{font-size:14px;max-width:26ch}
.s-cat.big img{width:56%}
.s-cat .arr{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:var(--s-navy);color:#fff;display:grid;place-items:center}
.s-cat.all{background:var(--s-navy);color:#fff;border-color:var(--s-navy)}
.s-cat.all small{color:#AFC0DA}

/* товары */
.s-prods{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.s-prod{background:#fff;border:1px solid var(--s-line);border-radius:18px;padding:14px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:8px;position:relative}
.s-prod .tag{position:absolute;top:14px;left:14px;background:var(--s-red);color:#fff;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 8px}
.s-prod .tag.own{background:var(--s-navy)}
.s-prod img{width:100%;aspect-ratio:4/3;object-fit:contain;max-width:100%}
.s-prod h3{font-size:15px;font-weight:700;line-height:1.3;margin:0}
.s-prod .spec{font-size:12.5px;color:var(--s-mute)}
.price{display:grid;gap:2px}
.price b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.price b small{font-size:13px;font-weight:600;color:var(--s-mute)}
.price .per{font-size:12.5px;color:var(--s-mute);font-variant-numeric:tabular-nums}
.price .stock{font-size:12.5px;color:var(--s-green);font-weight:700}
.tiers{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.tiers span{background:var(--s-soft);border-radius:6px;padding:3px 7px}
.tiers span b{color:var(--s-blue)}
.buy{display:flex;gap:8px}
.qty{display:flex;align-items:center;border:1.5px solid var(--s-line);border-radius:10px;height:42px;font-weight:700;font-size:14px}
.qty i{font-style:normal;width:30px;text-align:center;color:var(--s-mute)}
.qty span{min-width:24px;text-align:center}
.cart{flex:1;background:var(--s-blue);color:#fff;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;height:42px}

/* отрасли */
.s-inds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.s-ind{display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:16px;border:1px solid var(--s-line);background:#fff}
.s-ind .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--s-ice);color:var(--s-blue);display:grid;place-items:center}
.s-ind b{display:block;font-size:16px;margin-bottom:2px}
.s-ind span{color:var(--s-mute);font-size:14px}

/* заявка */
.s-lead{background:var(--s-navy);color:#fff;border-radius:24px;padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.s-lead h2{font-size:32px;line-height:1.15;margin:10px 0 14px}
.s-lead p{color:#C3D1E6;margin:0;max-width:44ch}
.s-form{background:#fff;color:var(--s-ink);border-radius:18px;padding:22px;display:grid;gap:12px}
.s-field{border:1.5px solid var(--s-line);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.s-field small{font-size:12px;color:var(--s-mute);font-weight:600}
.s-field span{font-size:15px}
.s-field span.ph{color:#9AA6B6}
.s-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-form .s-btn{width:100%}
.s-form .fine{font-size:12px;color:var(--s-mute);margin:0}

.s-about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.s-about h2{font-size:32px;line-height:1.15;margin:10px 0 16px}
.s-about p{color:var(--s-mute);margin:0 0 14px;max-width:56ch}
.s-about .quote{border-left:3px solid var(--s-red);padding:4px 0 4px 18px;font-size:18px;font-weight:600;color:var(--s-ink);max-width:40ch}
.s-gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-gal div{aspect-ratio:1;border-radius:16px;background:var(--s-soft) center/cover no-repeat;border:1px solid var(--s-line)}
.s-gal div:first-child{grid-row:span 2;aspect-ratio:auto}

.s-foot{background:var(--s-navy);color:#AFC0DA;padding:48px 0 24px;font-size:14px}
.s-foot .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
.s-foot h4{color:#fff;font-size:14px;margin:0 0 12px}
.s-foot p{margin:0 0 7px}
.s-foot .s-logo{width:200px;margin-bottom:14px}
.s-foot .big{color:#fff;font-weight:800;font-size:19px}
.s-foot .copy{border-top:1px solid rgba(255,255,255,.12);margin-top:28px;padding-top:16px;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.s-tabbar{display:none}

/* ---------- телефон ---------- */
@container (max-width:640px){
  .s-in{padding-inline:16px}
  .s-top,.s-nav,.s-phone{display:none}
  .s-head .s-in{height:62px;gap:8px}
  .s-logo{width:150px}
  .s-icons{margin-left:auto}
  .s-icons .hide-m{display:none}
  .s-ico{width:40px;height:40px}
  .s-burger{display:grid}
  .s-hero .s-in{grid-template-columns:1fr;padding-block:30px 0;gap:6px}
  .s-hero h1{font-size:28px;margin:10px 0 12px}
  .s-hero p{font-size:15px;margin-bottom:20px}
  .s-btn{height:48px;padding:0 18px;font-size:14.5px}
  .s-hero .s-btns .s-btn{flex:1 1 100%}
  .s-art{margin-inline:-16px}
  .s-badge{font-size:11.5px;padding:7px 10px}
  .s-facts .s-in{grid-template-columns:1fr 1fr}
  .s-facts .s-in>div,.s-facts .s-in>div+div{padding:16px 0 16px 0;border-left:0}
  .s-facts .s-in>div:nth-child(even){padding-left:14px;border-left:1px solid rgba(255,255,255,.12)}
  .s-facts .s-in>div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
  .s-facts b{font-size:17px}
  .s-facts span{font-size:12.5px}
  .s-sec{padding:40px 0}
  .s-h{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:20px}
  .s-h h2,.s-lead h2,.s-about h2{font-size:23px}
  .s-paths,.s-made,.s-inds,.s-lead,.s-about{grid-template-columns:1fr}
  .s-path{padding:22px;min-height:0}
  .s-path h3{font-size:20px}
  .s-path img{width:120px}
  .s-made{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .s-mcard .tx{padding:12px}
  .s-mcard h3{font-size:14.5px}
  .s-mcard p{display:none}
  .s-steps{grid-template-columns:1fr}
  .s-step{padding:18px 20px;display:grid;grid-template-columns:auto 1fr;column-gap:14px}
  .s-step::before{margin:3px 0 0;grid-row:span 2}
  .s-step+.s-step{border-left:0;border-top:1px solid var(--s-line)}
  .s-groups{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .s-groups a{white-space:nowrap}
  .s-cats{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:128px;gap:10px}
  .s-cat{padding:14px;border-radius:14px}
  .s-cat b{font-size:14px;hyphens:auto;overflow-wrap:anywhere}
  .s-cat small{display:none}
  .s-cat.big{grid-column:span 2;grid-row:span 1}
  .s-cat.big b{font-size:19px}
  .s-cat.big small{display:block;font-size:12.5px}
  .s-cat.big img{width:44%}
  .s-cat .arr{width:30px;height:30px}
  .s-prods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .s-prod{padding:10px;border-radius:14px}
  .s-prod h3{font-size:13px}
  .s-prod .spec,.tiers{display:none}
  .price b{font-size:18px}
  .buy{flex-direction:column;gap:6px}
  .qty{height:38px;justify-content:space-between}
  .cart{height:38px;flex:none}
  .s-ind{padding:14px}
  .s-lead{padding:22px;border-radius:18px;gap:20px}
  .s-row2{grid-template-columns:1fr}
  .s-about{gap:20px}
  .s-gal{order:-1}
  .s-foot .grid{grid-template-columns:1fr;gap:20px}
  .s-foot{padding-bottom:90px}
  .s-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:#fff;border-top:1px solid var(--s-line);padding:6px 4px 8px;z-index:6}
  .s-tabbar a{display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--s-mute)}
  .s-tabbar a.on{color:var(--s-blue)}
  .s-tabbar a.call span.ring{background:var(--s-red);color:#fff;border-radius:12px;width:44px;height:30px;display:grid;place-items:center}
  .s-tabbar a.call b{color:var(--s-red);font-weight:700}
}
@media (prefers-reduced-motion:reduce){.s-cat{transition:none}.s-cat:hover{transform:none}}

.lsw{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:4px;background:rgba(11,28,56,.92);backdrop-filter:blur(8px);border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--f-site)}
.lsw span{color:#AFC0DA;font-size:12px;font-weight:700;padding:0 8px 0 10px}
.lsw button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fff;font:700 13px var(--f-site);cursor:pointer}
.lsw button[aria-pressed="true"]{background:#fff;color:#0B1C38}
.lsw button:focus-visible,.lsw a:focus-visible{outline:2px solid #8CC4F5;outline-offset:2px}
.lsw a{color:#fff;font-size:12px;font-weight:700;padding:0 10px;text-decoration:none;opacity:.85}
@media (max-width:640px){.lsw{bottom:84px;right:50%;transform:translateX(50%)}.lsw span{display:none}}
</style>
</head>
<body>
<div class="site" id="site"></div>
<div class="lsw" role="group" aria-label="Логотип"><span>Логотип</span><div id="lsw" style="display:flex;gap:2px"></div><a href="logos.html">Все</a></div>
<script>
(function(){

const C={blue:'#1D4FA8',navy:'#0D1F3F',red:'#E1312C',sky:'#5BA8E8',white:'#FFFFFF'};

/* ---- знаки (64×64) ---- */
const MARK={
  A:(d)=>`<circle cx="24" cy="28" r="21" fill="${C.blue}"/>
    <circle cx="24" cy="28" r="14" fill="none" stroke="${C.white}" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="24" cy="28" r="7.5" fill="${d?C.navy:C.white}"/>
    <circle cx="24" cy="28" r="3.2" fill="${C.red}"/>

const K=VARS.map(v=>v.k);
const fromHash=()=>{const h=location.hash.slice(1).toUpperCase();return K.includes(h)?h:null};
let saved=null; try{saved=localStorage.getItem('upak-logo')}catch(e){}
cur=fromHash()||(K.includes(saved)?saved:'A');
const box=document.getElementById('lsw'), root=document.getElementById('site');
box.innerHTML=VARS.map(v=>`<button type="button" data-k="${v.k}" title="${v.name}" aria-label="${v.name}">${v.k}</button>`).join('');
function render(){
  root.innerHTML=site();
  box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
  document.querySelector('link[rel=icon]').href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">${MARK[cur](0)}</svg>`);
}
box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.k;try{localStorage.setItem('upak-logo',cur)}catch(e){}history.replaceState(null,'','#'+cur);render();});
addEventListener('hashchange',()=>{const h=fromHash();if(h&&h!==cur){cur=h;render();}});
root.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')==='#')e.preventDefault();});
render();
})();
</script>
